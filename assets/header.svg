<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Kickfok</title>
  <desc id="d">Kickfok: разработчик 1С. Доработки на БСП для ERP, Комплексной автоматизации и Документооборота, интеграции, локальные LLM и MCP для баз 1С, настольные приложения на C#. Справа логотип проекта 1C MCP Ollama Bridge.</desc>
  <defs>
    <linearGradient id="speed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6A13" stop-opacity="0"/><stop offset="1" stop-color="#FF6A13"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="360" rx="18"/></clipPath>
  </defs>
  <rect width="1200" height="360" rx="18" fill="#FBFAF7"/>
  <g clip-path="url(#card)">
