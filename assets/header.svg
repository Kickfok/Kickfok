<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Kickfok</title>
  <desc id="d">Kickfok: разработчик 1С. Доработки на БСП для ERP, Комплексной автоматизации и Документооборота, интеграции, локальные LLM и MCP для баз 1С, настольные приложения на C#. Стек: 1С:Предприятие, БСП, BSL, Python, Ollama, MCP, C#, .NET, SQL Server.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/></pattern>
    <radialGradient id="gy" cx="10%" cy="0%" r="65%"><stop offset="0" stop-color="#FFC21A" stop-opacity="0.24"/><stop offset="1" stop-color="#FFC21A" stop-opacity="0"/></radialGradient>
    <radialGradient id="gv" cx="95%" cy="100%" r="60%"><stop offset="0" stop-color="#8B7CFF" stop-opacity="0.22"/><stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="360" rx="18" fill="#0B0E1C"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="18" fill="url(#gy)"/>
  <rect width="1200" height="360" rx="18" fill="url(#gv)"/>
  <text x="48" y="64" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#FFC21A" letter-spacing="2.5">ПРИВЕТ, Я KICKFOK</text>
  <text x="48" y="126" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="48" fill="#E9ECF8" font-weight="800">Разработчик 1С<tspan fill="#8B7CFF">.</tspan></text>
  <text x="48" y="182" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="40" fill="#E9ECF8" font-weight="800">Доработки, интеграции и <tspan fill="#FFC21A">локальные LLM</tspan>.</text>
  <rect x="48" y="220" width="640" height="48" rx="12" fill="#141831" stroke="#262B4E" stroke-width="1.5"/>
  <text x="68" y="251" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#6B7199" font-weight="700">$</text>
  <text x="88" y="251" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="600" fill="#FFC21A" opacity="1">доработки на БСП: ERP, КА, Документооборот<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.240;0.250;0.99;1" dur="12.8s" repeatCount="indefinite"/></text>
  <text x="88" y="251" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="600" fill="#6CCFF6" opacity="0">интеграции 1С: HTTP-сервисы, обмены, отчеты<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.260;0.490;0.500;1" dur="12.8s" repeatCount="indefinite"/></text>
  <text x="88" y="251" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="600" fill="#8B7CFF" opacity="0">локальные LLM и MCP для баз 1С<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.510;0.740;0.750;1" dur="12.8s" repeatCount="indefinite"/></text>
  <text x="88" y="251" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="600" fill="#5EE0A0" opacity="0">настольные приложения на C# и .NET<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.750;0.760;0.990;1.000;1" dur="12.8s" repeatCount="indefinite"/></text>
  <rect x="48" y="292" width="258" height="34" rx="17" fill="#FFC21A" fill-opacity="0.1" stroke="#FFC21A" stroke-opacity="0.5"/>
  <circle cx="66" cy="309" r="4" fill="#FFC21A"/>
  <text x="80" y="314" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#FFC21A" font-weight="600">1С:Предприятие · БСП · BSL</text>
  <rect x="318.4" y="292" width="216" height="34" rx="17" fill="#8B7CFF" fill-opacity="0.1" stroke="#8B7CFF" stroke-opacity="0.5"/>
  <circle cx="336.4" cy="309" r="4" fill="#8B7CFF"/>
  <text x="350.4" y="314" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#8B7CFF" font-weight="600">Python · Ollama · MCP</text>
  <rect x="546.8" y="292" width="225" height="34" rx="17" fill="#6CCFF6" fill-opacity="0.1" stroke="#6CCFF6" stroke-opacity="0.5"/>
  <circle cx="564.8" cy="309" r="4" fill="#6CCFF6"/>
  <text x="578.8" y="314" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#6CCFF6" font-weight="600">C# · .NET · SQL Server</text>
  <g transform="translate(940 90)">
    <rect width="200" height="200" rx="44" fill="#FFC21A"/>
    <g fill="none" stroke="#1B1F3B" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M68 46 V154"/>
      <path id="armUp" d="M72 104 L134 46"/>
      <path id="armDown" d="M96 82 L138 154"/>
    </g>
    <circle r="6" fill="#FFFFFF"><animateMotion dur="1.8s" repeatCount="indefinite" path="M72 104 L134 46"/></circle>
    <circle r="6" fill="#FFFFFF"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite" path="M96 82 L138 154"/></circle>
  </g>
  <circle cx="1040" cy="190" r="112" fill="none" stroke="#FFC21A" stroke-opacity="0.25" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="0 1040 190" to="360 1040 190" dur="40s" repeatCount="indefinite"/></circle>
  </svg>
