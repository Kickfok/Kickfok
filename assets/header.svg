  <circle cx="1050" cy="180" r="120" fill="none" stroke="#FFC000" stroke-width="20" stroke-opacity="0.13"/>
  <circle cx="1050" cy="180" r="92" fill="none" stroke="#E5231B" stroke-width="16" stroke-opacity="0.13"/>
  <rect x="-300" y="118" width="260" height="6" rx="3" fill="url(#speed)" opacity="0.55"><animate attributeName="x" values="-300;860" dur="2.6s" begin="0.0s" repeatCount="indefinite"/></rect>
  <rect x="-300" y="150" width="180" height="6" rx="3" fill="url(#speed)" opacity="0.55"><animate attributeName="x" values="-300;860" dur="2.1s" begin="0.5s" repeatCount="indefinite"/></rect>
  <rect x="-300" y="214" width="220" height="6" rx="3" fill="url(#speed)" opacity="0.55"><animate attributeName="x" values="-300;860" dur="2.9s" begin="1.0s" repeatCount="indefinite"/></rect>
  <rect x="-300" y="246" width="150" height="6" rx="3" fill="url(#speed)" opacity="0.55"><animate attributeName="x" values="-300;860" dur="2.3s" begin="1.5s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="0" y="0" width="10" height="360" fill="#E5231B" clip-path="url(#card)"/>
  <text x="48" y="64" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#E5231B" font-weight="700" letter-spacing="2.5">ПРИВЕТ, Я KICKFOK</text>
  <text x="48" y="126" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="48" fill="#16181D" font-weight="800">Разработчик 1С<tspan fill="#FF6A13">.</tspan></text>
  <text x="48" y="182" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="38" fill="#16181D" font-weight="800">Доработки, интеграции и <tspan fill="#E5231B">локальные LLM</tspan>.</text>
  <path d="M48 196 H492 L484 206 H40 Z" fill="#FF6A13"/>
  <rect x="48" y="226" width="640" height="46" rx="10" fill="#FFFFFF" stroke="#E4E1DA" stroke-width="1.5"/>
  <text x="68" y="256" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#5C6270" font-weight="700">$</text>
  <text x="88" y="256" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="600" fill="#E5231B" opacity="1">доработки на БСП: ERP, КА, Документооборот<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.240;0.250;0.99;1" dur="12.8s" repeatCount="indefinite"/></text>
  <text x="88" y="256" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="600" fill="#FF6A13" opacity="0">интеграции 1С: HTTP-сервисы, обмены, отчеты<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.250;0.260;0.490;0.500;1" dur="12.8s" repeatCount="indefinite"/></text>
  <text x="88" y="256" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="600" fill="#16181D" opacity="0">локальные LLM и MCP для баз 1С<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.500;0.510;0.740;0.750;1" dur="12.8s" repeatCount="indefinite"/></text>
  <text x="88" y="256" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="600" fill="#E5231B" opacity="0">настольные приложения на C# и .NET<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.750;0.760;0.990;1.000;1" dur="12.8s" repeatCount="indefinite"/></text>
